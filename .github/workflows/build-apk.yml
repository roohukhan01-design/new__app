name: Build Roohu ClipForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Restore Android project folders if files were uploaded flat
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle ]; then
            echo "Restoring the Android folder structure from the individually uploaded root files."
            mkdir -p app/src/main/java/com/roohu/clipforge app/src/main/assets
            mkdir -p app/src/main/res/{layout,values,values-v31,drawable,mipmap-anydpi-v26}
            mkdir -p shared/core shared/test

            cp build-1.gradle app/build.gradle
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            cp MainActivity.java app/src/main/java/com/roohu/clipforge/
            for f in YouTubeClient.java Transcriber.java SecureStore.java Pcm16k.java Painter.java Net.java MusicSynth.java MusicSearch.java GeminiClient.java FxEffect.java Energy.java CloudAsr.java ClipExporter.java; do
              [ ! -f "$f" ] || cp "$f" app/src/main/java/com/roohu/clipforge/"
            done
            cp Roohu-ClipForge.html app/src/main/assets/
            cp validate.js shared/core/validate.js
            cp validate.js app/src/main/assets/validate.js
            cp activity_main.xml app/src/main/res/layout/
            cp strings.xml colors.xml app/src/main/res/values/
            cp themes.xml app/src/main/res/values/themes.xml
            cp themes-1.xml app/src/main/res/values-v31/themes.xml
            cp ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
            cp ic_launcher_foreground.xml splash_logo.xml splash_glow.xml splash_bg.xml app/src/main/res/drawable/
            cp validate.test.js projects.test.js subtitles.test.js shared/test/
          fi

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for f in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/Roohu-ClipForge.html app/src/main/java/com/roohu/clipforge/MainActivity.java app/src/main/res/layout/activity_main.xml; do
            test -s "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done

      - name: Download offline speech models
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -fL --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip
          mv vosk-model-small-en-us-0.15 model-en
          rm en.zip
          curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip
          mv vosk-model-small-hi-0.22 model-hi
          rm hi.zip

      - name: Download caption fonts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fL --retry 3 -o "$2" "$B/$1/$2" || echo "::warning::Font $2 unavailable; app will use fallback font."; }
          get anton Anton-Regular.ttf
          get bebasneue BebasNeue-Regular.ttf
          get bangers Bangers-Regular.ttf
          get archivoblack ArchivoBlack-Regular.ttf
          get poppins Poppins-Black.ttf
          get poppins Poppins-ExtraBold.ttf
          get bungee Bungee-Regular.ttf
          get luckiestguy LuckiestGuy-Regular.ttf
          get russoone RussoOne-Regular.ttf
          get blackopsone BlackOpsOne-Regular.ttf
          get tajawal Tajawal-Black.ttf
          test -s Poppins-Black.ttf
          test -s Poppins-ExtraBold.ttf

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run JavaScript tests
        run: |
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
